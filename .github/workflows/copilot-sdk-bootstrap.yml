name: Bootstrap Copilot SDK provider

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/copilot-sdk.patch')
          lines = path.read_text().splitlines()
          output = []
          for index, line in enumerate(lines):
              if not line.startswith('@@ '):
                  output.append(line)
                  continue
              match = re.match(r'@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*)', line)
              if match is None:
                  raise SystemExit(f'invalid hunk header: {line}')
              old_count = new_count = 0
              for body in lines[index + 1:]:
                  if body.startswith('@@ ') or body.startswith('diff --git '):
                      break
                  if body.startswith((' ', '-')):
                      old_count += 1
                  if body.startswith((' ', '+')):
                      new_count += 1
              def suffix(count: int) -> str:
                  return '' if count == 1 else f',{count}'
              output.append(
                  f'@@ -{match.group(1)}{suffix(old_count)} '
                  f'+{match.group(2)}{suffix(new_count)} @@{match.group(3)}'
              )
          path.write_text('\n'.join(output) + '\n')
          PY
          git apply --check --verbose .github/copilot-sdk.patch
          git apply .github/copilot-sdk.patch

      - name: Format
        run: cargo fmt --all

      - name: Check provider crate
        run: cargo check -p provider

      - name: Test provider crate
        run: cargo test -p provider --lib

      - name: Commit validated changes and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/copilot-sdk.patch .github/workflows/copilot-sdk-bootstrap.yml
          git commit -m "Add GitHub Copilot SDK provider"
          git push origin "HEAD:${{ github.head_ref }}"
